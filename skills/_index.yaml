# Indeks L1 skills — HANYA metadata ini yang selalu masuk konteks agent (doc 12, P-3).
# Isi penuh (L2) dimuat engine hanya untuk skill terpilih. Sinkron dengan folder di direktori ini.
version: 1
skills:
  - name: recon-deep
    description: "Recon mendalam: subdomain, DNS, live host, fingerprint, JS & endpoint extraction"
    triggers: { phase: recon }
    safety_level: 0
    context_cost: 2100
  - name: subdomain-enum
    description: "Enumerasi subdomain pasif+aktif dan resolusi DNS"
    triggers: { phase: recon, needs: root-domain }
    safety_level: 0
    context_cost: 900
  - name: xss-reflected
    description: "Tes & validasi reflected XSS dengan payload marker non-destruktif"
    triggers: { fingerprint: ["param-reflection", "content-type:text/html"], phase: validation }
    safety_level: 1
    context_cost: 1800
  - name: idor-auth
    description: "Auth differential antar aktor (anon/A/B) pada state model untuk IDOR & access control"
    triggers: { fingerprint: ["authenticated-objects", "numeric-or-uuid-ids"], phase: validation }
    safety_level: 1
    context_cost: 2400
  - name: ssrf-blind
    description: "Deteksi SSRF blind dengan korelasi out-of-band (interactsh) ke server milik sendiri"
    triggers: { fingerprint: ["url-parameter", "fetch-or-webhook-feature"], phase: validation }
    safety_level: 2
    context_cost: 2200
  - name: exposed-files
    description: "Pemeriksaan file/endpoint terekspos (.git, .env, backup, debug) dengan baseline anti-200-trap"
    triggers: { phase: scanning }
    safety_level: 0
    context_cost: 1200
  - name: open-redirect
    description: "Validasi open redirect ke domain marker milik sendiri + kontrol redirect internal"
    triggers: { fingerprint: ["redirect-parameter"], phase: validation }
    safety_level: 1
    context_cost: 1100
  - name: cors-check
    description: "Validasi CORS misconfiguration secara browser-realistic (bukan curl)"
    triggers: { fingerprint: ["api-with-credentials", "origin-reflection"], phase: validation }
    safety_level: 1
    context_cost: 1600
